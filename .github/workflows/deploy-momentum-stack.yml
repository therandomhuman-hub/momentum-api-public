name: Deploy Momentum Stack

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'auth/**'
      - 'worker/migrations/**'
      - '.github/workflows/deploy-momentum-stack.yml'
  workflow_dispatch:
    inputs:
      private_engine_ref:
        description: 'Branch, tag, or commit SHA from momentum-engine to deploy'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: momentum-stack-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public gateway
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Checkout private engine
        uses: actions/checkout@v7
        with:
          repository: therandomhuman-hub/momentum-engine
          token: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          ref: ${{ inputs.private_engine_ref || 'main' }}
          path: _private-engine
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package.json
            auth/package.json
            _private-engine/worker/package.json
      - name: Install gateway dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Install auth dependencies
        working-directory: auth
        run: npm install --no-audit --no-fund
      - name: Install engine dependencies
        working-directory: _private-engine/worker
        run: npm install --no-audit --no-fund
      - name: Typecheck gateway
        working-directory: worker
        run: npm run typecheck
      - name: Typecheck auth
        working-directory: auth
        run: npm run typecheck
      - name: Typecheck engine
        working-directory: _private-engine/worker
        run: npm run typecheck
      - name: Provision Cloudflare D1 and KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          DB_NAME="momentum-production"
          KV_TITLE="momentum-rate-limit"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error "${AUTH[@]}" "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" > /tmp/d1-list.json
          jq -e '.success == true' /tmp/d1-list.json >/dev/null
          DB_ID="$(jq -r --arg name "$DB_NAME" '.result[] | select(.name == $name) | .uuid' /tmp/d1-list.json | head -n 1)"
          if [ -z "$DB_ID" ]; then
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error -X POST "${AUTH[@]}" "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" --data "{\"name\":\"${DB_NAME}\"}" > /tmp/d1-create.json
            jq -e '.success == true' /tmp/d1-create.json >/dev/null
            DB_ID="$(jq -r '.result.uuid // empty' /tmp/d1-create.json)"
          fi
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error "${AUTH[@]}" "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" > /tmp/kv-list.json
          jq -e '.success == true' /tmp/kv-list.json >/dev/null
          KV_ID="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' /tmp/kv-list.json | head -n 1)"
          if [ -z "$KV_ID" ]; then
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error -X POST "${AUTH[@]}" "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" --data "{\"title\":\"${KV_TITLE}\"}" > /tmp/kv-create.json
            jq -e '.success == true' /tmp/kv-create.json >/dev/null
            KV_ID="$(jq -r '.result.id // empty' /tmp/kv-create.json)"
          fi
          test -n "$DB_ID"; test -n "$KV_ID"
          printf '%s' "$DB_ID" > "$GITHUB_WORKSPACE/.momentum_db_id"
          node - "$DB_ID" "$KV_ID" <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          base.d1_databases=[{binding:'DB',database_name:'momentum-production',database_id:process.argv[2],migrations_dir:'migrations'}];
          base.kv_namespaces=[{binding:'RATE_LIMIT',id:process.argv[3]}];
          base.workers_dev=true;
          fs.writeFileSync('wrangler.deploy.json',JSON.stringify(base,null,2));
          NODE
      - name: Sync D1 migrations into engine checkout
        run: |
          set -euo pipefail
          mkdir -p _private-engine/worker/migrations
          for migration in worker/migrations/*.sql; do cp "$migration" "_private-engine/worker/migrations/$(basename "$migration")"; done
      - name: Apply engine D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx --yes wrangler@4.129.0 d1 migrations apply momentum-production --remote --config wrangler.deploy.json
      - name: Deploy private engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.deploy.json
      - name: Install private Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOMENTUM_GITHUB_TOKEN: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
          MOMENTUM_ADMIN_SECRET: ${{ secrets.MOMENTUM_ADMIN_SECRET }}
          MOMENTUM_ENGINE_SHARED_SECRET: ${{ secrets.MOMENTUM_ENGINE_SHARED_SECRET }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOMENTUM_GITHUB_TOKEN"
          test -n "$MOMENTUM_API_KEY_PEPPER"
          test -n "$MOMENTUM_ADMIN_SECRET"
          test -n "$MOMENTUM_ENGINE_SHARED_SECRET"
          printf '%s' "$MOMENTUM_GITHUB_TOKEN" | npx --yes wrangler@4.129.0 secret put GITHUB_TOKEN --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_API_KEY_PEPPER" | npx --yes wrangler@4.129.0 secret put API_KEY_PEPPER --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_ADMIN_SECRET" | npx --yes wrangler@4.129.0 secret put ADMIN_SECRET --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_ENGINE_SHARED_SECRET" | npx --yes wrangler@4.129.0 secret put GATEWAY_SHARED_SECRET --config wrangler.deploy.json
      - name: Create Google auth Worker config
        working-directory: auth
        run: |
          set -euo pipefail
          DB_ID="$(cat "$GITHUB_WORKSPACE/.momentum_db_id")"
          node - "$DB_ID" <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.deploy.json',JSON.stringify({name:'momentum-auth',main:'src/index.ts',compatibility_date:'2026-08-25',workers_dev:true,observability:{enabled:true},triggers:{crons:['0 * * * *']},d1_databases:[{binding:'DB',database_name:'momentum-production',database_id:process.argv[2]}]},null,2));
          NODE
      - name: Deploy Google auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: auth
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.deploy.json
      - name: Install Google auth Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        working-directory: auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOMENTUM_API_KEY_PEPPER"
          test -n "$GOOGLE_CLIENT_ID"
          printf '%s' "$MOMENTUM_API_KEY_PEPPER" | npx --yes wrangler@4.129.0 secret put API_KEY_PEPPER --config wrangler.deploy.json
          printf '%s' "$GOOGLE_CLIENT_ID" | npx --yes wrangler@4.129.0 secret put GOOGLE_CLIENT_ID --config wrangler.deploy.json
      - name: Deploy public gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOMENTUM_ENGINE_SHARED_SECRET: ${{ secrets.MOMENTUM_ENGINE_SHARED_SECRET }}
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOMENTUM_ENGINE_SHARED_SECRET"
          npx --yes wrangler@4.129.0 deploy
          printf '%s' "$MOMENTUM_ENGINE_SHARED_SECRET" | npx --yes wrangler@4.129.0 secret put ENGINE_SHARED_SECRET
      - name: Smoke test public gateway
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://momentum-api-public.manikandanruki2004.workers.dev"
          request(){ curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$@"; }
          request "$BASE_URL/health" | tee /tmp/health.json
          jq -e '.status == "ok" and .service == "momentum-api-public" and .engine == "service-binding-ok" and .auth == "service-binding-ok" and .access == "gmail-free" and .usage == "unlimited" and .rate_limit_per_minute == 10 and .max_results == 20' /tmp/health.json >/dev/null
          request "$BASE_URL/version" | tee /tmp/version.json
          jq -e '.name == "Momentum API" and .version == "3.1.0" and .engine == "1.4.0" and .auth == "3.0.0" and .access == "gmail-free" and .usage == "unlimited" and .max_results == 20' /tmp/version.json >/dev/null
          STATUS="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /tmp/auth-health.json --write-out '%{http_code}' --retry 5 --retry-delay 2 "$BASE_URL/auth/health")"
          test "$STATUS" = "200"
          jq -e '.status == "ok" and .service == "momentum-auth" and .mode == "gmail-free"' /tmp/auth-health.json >/dev/null
          STATUS="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /tmp/auth-config.json --write-out '%{http_code}' --retry 5 --retry-delay 2 "$BASE_URL/auth/config")"
          test "$STATUS" = "200"
          jq -e '.google_client_id | type == "string" and length > 0' /tmp/auth-config.json >/dev/null
          for path in /auth/me /v1/me /v1/momentum; do
            STATUS="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /tmp/boundary.json --write-out '%{http_code}' --retry 5 --retry-delay 2 "$BASE_URL$path")"
            test "$STATUS" = "401"
            jq -e '.error.code == "UNAUTHORIZED"' /tmp/boundary.json >/dev/null
          done
          STATUS="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /tmp/method.json --write-out '%{http_code}' --retry 5 --retry-delay 2 -X PUT "$BASE_URL/health")"
          test "$STATUS" = "405"
          jq -e '.error.code == "METHOD_NOT_ALLOWED"' /tmp/method.json >/dev/null
