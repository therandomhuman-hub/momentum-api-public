name: Deploy Momentum Demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo-pages.yml'
      - 'openapi.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed SaaS dashboard
        shell: bash
        run: |
          set -euo pipefail
          PAGE="https://therandomhuman-hub.github.io/momentum-api-public/"
          curl --fail-with-body --silent --show-error --retry 8 --retry-delay 5 "$PAGE" -o /tmp/page.html
          grep -q 'Momentum' /tmp/page.html
          grep -q 'FREE · UNLIMITED' /tmp/page.html
          grep -q '20 repositories per scan' /tmp/page.html
          grep -q 'Sign in with Google' /tmp/page.html
          grep -q 'Build your scan' /tmp/page.html
          ! grep -q '../openapi.yaml' /tmp/page.html
          ! grep -q '../README.md' /tmp/page.html
          ! grep -qi 'Razorpay' /tmp/page.html
          ! grep -q 'requests/month' /tmp/page.html
          echo "GitHub Pages Momentum SaaS smoke check passed."
