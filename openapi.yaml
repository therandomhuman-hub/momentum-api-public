openapi: 3.1.0
info:
  title: Momentum API
  version: 1.8.0
  description: >-
    GitHub momentum intelligence with Gmail-only browser access. Verified
    Gmail accounts receive Free access automatically; Pro access is managed
    separately by Gmail address. No payment provider is used.
servers:
  - url: https://momentum-api-public.manikandanruki2004.workers.dev
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /version:
    get:
      security: []
      summary: API version
      responses:
        '200':
          description: Version information
  /v1/me:
    get:
      summary: Get authenticated API account and usage
      responses:
        '200':
          description: Account and usage summary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/momentum:
    get:
      summary: Rank GitHub repositories by momentum
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/MinStars'
        - $ref: '#/components/parameters/MaxAgeDays'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked repositories
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateOrQuotaExceeded'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /auth/health:
    get:
      security: []
      summary: Authentication binding health
      responses:
        '200':
          description: Authentication service is healthy
  /auth/config:
    get:
      security: []
      summary: Get public Google sign-in configuration
      responses:
        '200':
          description: Google configuration
  /auth/google:
    post:
      security: []
      summary: Exchange a verified Google credential for a Momentum session
      description: Verified @gmail.com accounts are automatically placed in Free access unless the email is in the Pro access list.
      responses:
        '200':
          description: Authenticated session created
        '403':
          description: Non-Gmail account
        '429':
          $ref: '#/components/responses/RateOrQuotaExceeded'
  /auth/me:
    get:
      summary: Get authenticated browser account and effective tier
      responses:
        '200':
          description: Account state
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: Revoke the authenticated browser session
      responses:
        '200':
          description: Session revoked
  /admin/pro/grant:
    post:
      security:
        - AdminSecret: []
      summary: Grant Pro access to a Gmail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GmailRequest'
      responses:
        '200':
          description: Pro access granted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/pro/revoke:
    post:
      security:
        - AdminSecret: []
      summary: Revoke Pro access and return a Gmail address to Free
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GmailRequest'
      responses:
        '200':
          description: Pro access revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Customer API key. Authorization: Bearer is also accepted.
    AdminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
  parameters:
    Language:
      name: language
      in: query
      schema:
        type: string
        maxLength: 64
    MinStars:
      name: min_stars
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 100
    MaxAgeDays:
      name: max_age_days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 36500
        default: 3650
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
  schemas:
    GmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          pattern: '^[^\\s@]+@gmail\\.com$'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Administrative authorization required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateOrQuotaExceeded:
      description: Rate limit or monthly quota exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpstreamError:
      description: Upstream dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
