openapi: 3.1.0
info:
  title: Momentum API
  version: 3.0.0
  description: >-
    Free GitHub momentum intelligence with Gmail-only browser access. Every
    verified Gmail account receives the same Free experience with up to 10
    repositories returned per momentum scan and 100 requests per calendar
    month. There is no Pro tier and no payment provider.
servers:
  - url: https://momentum-api-public.manikandanruki2004.workers.dev
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      summary: Production health check
      responses:
        '200':
          description: Gateway, authentication binding, and engine binding are healthy
        '503':
          description: A required production dependency is unavailable
  /version:
    get:
      security: []
      summary: API version
      responses:
        '200':
          description: Current production contract versions
  /v1/me:
    get:
      summary: Get authenticated account and quota state
      responses:
        '200':
          description: Free account summary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/momentum:
    get:
      summary: Rank GitHub repositories by momentum
      description: Returns up to 10 ranked repositories per scan. Free accounts have 100 requests per calendar month and a 10-request-per-minute customer limit.
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/MinStars'
        - $ref: '#/components/parameters/MaxAgeDays'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked repositories
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QuotaOrRateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /auth/health:
    get:
      security: []
      summary: Authentication service health
      responses:
        '200':
          description: Authentication service is configured
        '503':
          description: Authentication configuration is incomplete
  /auth/config:
    get:
      security: []
      summary: Get public Google sign-in configuration
      responses:
        '200':
          description: Google OAuth client configuration
  /auth/google:
    post:
      security: []
      summary: Exchange a verified Google credential for a Free Momentum session
      description: Only verified @gmail.com accounts are accepted. The session token is opaque and is stored server-side only as a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  minLength: 1
                  maxLength: 12000
      responses:
        '200':
          description: Free authenticated session created
        '400':
          description: Invalid request
        '401':
          description: Google credential could not be verified
        '403':
          description: Non-Gmail account
        '429':
          $ref: '#/components/responses/QuotaOrRateLimited'
  /auth/me:
    get:
      security:
        - BearerAuth: []
      summary: Get the authenticated Gmail account and Free plan state
      responses:
        '200':
          description: Free account state
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      security:
        - BearerAuth: []
      summary: Revoke the authenticated browser session
      responses:
        '200':
          description: Session revoked
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Developer API key. Authorization: Bearer mk_live_... is also accepted by the engine.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: MomentumSession
  parameters:
    Language:
      name: language
      in: query
      schema:
        type: string
        maxLength: 64
    MinStars:
      name: min_stars
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 100
    MaxAgeDays:
      name: max_age_days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 36500
        default: 3650
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaOrRateLimited:
      description: Monthly quota or per-minute rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpstreamError:
      description: GitHub upstream failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpstreamUnavailable:
      description: Production service dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
