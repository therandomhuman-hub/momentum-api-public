openapi: 3.1.0
info:
  title: Momentum API
  version: 2.0.0
  description: >-
    Free GitHub momentum intelligence with Gmail-only browser access. Every
    verified Gmail account receives the same Free experience. There is no Pro
    tier and no payment provider.
servers:
  - url: https://momentum-api-public.manikandanruki2004.workers.dev
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /version:
    get:
      security: []
      summary: API version
      responses:
        '200':
          description: Version information
  /v1/me:
    get:
      summary: Get authenticated API account and usage
      responses:
        '200':
          description: Free account and usage summary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/momentum:
    get:
      summary: Rank GitHub repositories by momentum
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/MinStars'
        - $ref: '#/components/parameters/MaxAgeDays'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked repositories
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateOrQuotaExceeded'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /auth/health:
    get:
      security: []
      summary: Authentication binding health
      responses:
        '200':
          description: Authentication service is healthy
  /auth/config:
    get:
      security: []
      summary: Get public Google sign-in configuration
      responses:
        '200':
          description: Google configuration
  /auth/google:
    post:
      security: []
      summary: Exchange a verified Google credential for a free Momentum session
      description: Verified @gmail.com accounts receive Free access automatically.
      responses:
        '200':
          description: Free authenticated session created
        '403':
          description: Non-Gmail account
        '429':
          $ref: '#/components/responses/RateOrQuotaExceeded'
  /auth/me:
    get:
      summary: Get authenticated Gmail account and Free plan state
      responses:
        '200':
          description: Free account state
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: Revoke the authenticated browser session
      responses:
        '200':
          description: Session revoked
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Customer API key. Authorization: Bearer is also accepted.
  parameters:
    Language:
      name: language
      in: query
      schema:
        type: string
        maxLength: 64
    MinStars:
      name: min_stars
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 100
    MaxAgeDays:
      name: max_age_days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 36500
        default: 3650
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateOrQuotaExceeded:
      description: Rate limit or monthly quota exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpstreamError:
      description: Upstream dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
